{% load static %}
<header
    class="fixed top-0 left-0 w-full z-40 px-6 py-6 md:px-12 md:py-8 flex justify-between items-center mix-blend-difference">
    <!-- Menu Trigger (Left) -->
    <button @click="menuOpen = true" class="group flex items-center gap-3 focus:outline-none"
        aria-label="Open navigation menu">
        <div class="flex flex-col gap-1.5 w-6">
            <span class="h-[1px] w-full bg-white transition-transform duration-300 group-hover:translate-x-1"></span>
            <span class="h-[1px] w-4 bg-white transition-transform duration-300 group-hover:translate-x-2"></span>
        </div>
        <span
            class="text-xs uppercase tracking-widest font-medium hidden md:inline transition-opacity duration-300 group-hover:opacity-70">Menu</span>
    </button>

    <!-- Branding (Center) -->
    <div class="absolute left-1/2 transform -translate-x-1/2">
        <a href="/"
            class="flex items-center gap-2.5 hover:opacity-80 transition-opacity duration-300">
            <img src="{% static 'images/logo.png' %}" alt="PRAVAAH Logo" class="w-7 h-7 md:w-8 md:h-8 object-contain" />
            <span class="text-xl md:text-2xl font-serif tracking-[0.25em] font-light text-white">
                PRAVAAH<span class="text-[#FF5500]">.</span>
            </span>
        </a>
    </div>

</header>
