<!-- Universal Image Lightbox / Fullscreen Preview Component -->
<div 
    x-data="{ 
        open: false, 
        src: '', 
        alt: '' 
    }"
    @keydown.escape.window="open = false"
    x-init="
        document.addEventListener('click', (e) => {
            const img = e.target.closest('img');
            if (!img) return;
            if (img.classList.contains('no-lightbox') || img.dataset.noLightbox !== undefined) return;
            
            e.preventDefault();
            e.stopPropagation();
            src = img.currentSrc || img.src;
            alt = img.alt || 'Full Image Preview';
            open = true;
        }, true);
    "
    class="relative z-[100]"
>
    <!-- Fullscreen Dark Overlay Backdrop -->
    <div 
        x-show="open"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] flex items-center justify-center p-4 md:p-10 cursor-zoom-out select-none"
        @click="open = false"
        style="display: none;"
    >
        <!-- Cross / Close Button (Top Left) -->
        <button 
            @click.stop="open = false"
            class="fixed top-6 left-6 md:top-8 md:left-8 z-[110] flex items-center gap-3 text-white/70 hover:text-white transition-colors duration-300 group focus:outline-none cursor-pointer p-2.5 rounded-full bg-black/60 border border-white/10 hover:border-white/40"
            aria-label="Close image preview"
            title="Close Preview"
        >
            <div class="relative w-5 h-5 flex items-center justify-center">
                <span class="absolute h-[1.5px] w-full bg-white transform rotate-45 transition-transform duration-300 group-hover:rotate-[135deg]"></span>
                <span class="absolute h-[1.5px] w-full bg-white transform -rotate-45 transition-transform duration-300 group-hover:rotate-[45deg]"></span>
            </div>
            <span class="text-xs uppercase tracking-[0.2em] font-mono pr-1 hidden sm:inline">Close</span>
        </button>

        <!-- Fullscreen Image Content -->
        <div 
            x-show="open"
            x-transition:enter="transition ease-out duration-300 delay-75"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-95"
            class="relative max-w-full max-h-full flex flex-col items-center justify-center pointer-events-auto"
            @click.stop
        >
            <img 
                :src="src" 
                :alt="alt" 
                class="max-w-[92vw] max-h-[85vh] object-contain border border-[#222] shadow-2xl rounded-sm"
            />
            <p 
                x-text="alt" 
                x-show="alt && alt !== 'Full Image Preview'" 
                class="mt-4 text-xs font-mono tracking-[0.2em] text-[#888] uppercase text-center max-w-xl px-4"
            ></p>
        </div>
    </div>
</div>
