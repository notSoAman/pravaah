<div 
    x-show="menuOpen"
    x-transition:enter="transition ease-out duration-500"
    x-transition:enter-start="opacity-0 translate-y-4"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-300"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 translate-y-4"
    class="fixed inset-0 bg-black z-50 flex flex-col justify-between p-8 md:p-16 lg:p-20 overflow-y-auto min-h-screen"
    @keydown.escape.window="menuOpen = false"
    style="display: none;"
>
    <!-- Top Row: Close button (Right) -->
    <div class="flex justify-end pt-2">
        <button 
            @click="menuOpen = false"
            class="group flex items-center gap-3 focus:outline-none"
            aria-label="Close navigation menu"
        >
            <span class="text-xs uppercase tracking-widest font-medium transition-opacity duration-300 group-hover:opacity-70">Close</span>
            <div class="relative w-6 h-6 flex items-center justify-center">
                <span class="absolute h-[1px] w-full bg-white transform rotate-45 transition-transform duration-300 group-hover:rotate-[135deg]"></span>
                <span class="absolute h-[1px] w-full bg-white transform -rotate-45 transition-transform duration-300 group-hover:rotate-[45deg]"></span>
            </div>
        </button>
    </div>

    <!-- Main Navigation Links (Centered) -->
    <nav class="flex flex-col justify-center items-start space-y-6 md:space-y-10 my-auto pl-6 md:pl-16 py-10 md:py-16">
        <div class="group/nav flex flex-col space-y-4 md:space-y-6 w-full">
            <a href="{% url 'films_list' %}" class="inline-block text-5xl md:text-8xl font-serif font-light tracking-wide text-white hover:text-white transition-all duration-500 hover:translate-x-4 group-hover/nav:opacity-40 hover:!opacity-100">
                Films
            </a>
            <a href="{% url 'events_list' %}" class="inline-block text-5xl md:text-8xl font-serif font-light tracking-wide text-white hover:text-white transition-all duration-500 hover:translate-x-4 group-hover/nav:opacity-40 hover:!opacity-100">
                Events
            </a>
            <a href="{% url 'journal_list' %}" class="inline-block text-5xl md:text-8xl font-serif font-light tracking-wide text-white hover:text-white transition-all duration-500 hover:translate-x-4 group-hover/nav:opacity-40 hover:!opacity-100">
                Journal
            </a>
            <a href="{% url 'team' %}" class="inline-block text-5xl md:text-8xl font-serif font-light tracking-wide text-white hover:text-white transition-all duration-500 hover:translate-x-4 group-hover/nav:opacity-40 hover:!opacity-100">
                Team
            </a>
        </div>
    </nav>

    <!-- Footer: branding & social links -->
    <div class="w-full pt-8 pb-10 md:pb-16 border-t border-[#1a1a1a]">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 text-xs uppercase tracking-widest text-[#666666]">
            <div>
                <p class="font-medium text-white mb-1">PRAVAAH</p>
                <p>Mass-Communication &amp; Media Club</p>
            </div>
            <div class="flex gap-8">
                <a href="https://www.instagram.com/pravaah.ggsipu/" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors duration-300">Instagram</a>
                <a href="mailto:ujjwal.017203024@std.ggsipu.ac.in" class="hover:text-white transition-colors duration-300">Contact</a>
            </div>
        </div>
    </div>
</div>
