<div 
    x-show="menuOpen"
    x-transition:enter="transition ease-out duration-500"
    x-transition:enter-start="opacity-0 translate-y-4"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-300"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 translate-y-4"
    class="fixed inset-0 bg-black z-50 flex flex-col justify-between p-8 md:p-16"
    @keydown.escape.window="menuOpen = false"
    style="display: none;"
>
    <!-- Top Row: Close button (Right) -->
    <div class="flex justify-end">
        <button 
            @click="menuOpen = false"
            class="group flex items-center gap-3 focus:outline-none"
            aria-label="Close navigation menu"
        >
            <span class="text-xs uppercase tracking-widest font-medium transition-opacity duration-300 group-hover:opacity-70">Close</span>
            <div class="relative w-6 h-6 flex items-center justify-center">
                <span class="absolute h-[1px] w-full bg-white transform rotate-45 transition-transform duration-300 group-hover:rotate-[135deg]"></span>
                <span class="absolute h-[1px] w-full bg-white transform -rotate-45 transition-transform duration-300 group-hover:rotate-[45deg]"></span>
            </div>
        </button>
    </div>

    <!-- Main Navigation Links (Centered) -->
    <nav class="flex flex-col justify-center items-start space-y-6 md:space-y-10 my-auto pl-4 md:pl-12">
        <div class="group/nav flex flex-col space-y-4 md:space-y-8 w-full">
            <a href="#" class="inline-block text-5xl md:text-8xl font-serif font-light tracking-wide text-white hover:text-white transition-all duration-500 hover:translate-x-4 group-hover/nav:opacity-40 hover:!opacity-100">
                Films
            </a>
            <a href="#" class="inline-block text-5xl md:text-8xl font-serif font-light tracking-wide text-white hover:text-white transition-all duration-500 hover:translate-x-4 group-hover/nav:opacity-40 hover:!opacity-100">
                Events
            </a>
            <a href="#" class="inline-block text-5xl md:text-8xl font-serif font-light tracking-wide text-white hover:text-white transition-all duration-500 hover:translate-x-4 group-hover/nav:opacity-40 hover:!opacity-100">
                Journal
            </a>
            <a href="#" class="inline-block text-5xl md:text-8xl font-serif font-light tracking-wide text-white hover:text-white transition-all duration-500 hover:translate-x-4 group-hover/nav:opacity-40 hover:!opacity-100">
                Team
            </a>
            <a href="#" class="inline-block text-5xl md:text-8xl font-serif font-light tracking-wide text-white hover:text-white transition-all duration-500 hover:translate-x-4 group-hover/nav:opacity-40 hover:!opacity-100">
                About
            </a>
        </div>
    </nav>

    <!-- Footer: branding & minor details -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 text-xs uppercase tracking-widest text-[#666666] border-t border-[#1a1a1a] pt-8">
        <div>
            <p class="font-medium text-white mb-1">PRAVAAH</p>
            <p>Mass-Communication & Media Club</p>
        </div>
        <div class="flex gap-8">
            <a href="#" class="hover:text-white transition-colors duration-300">Instagram</a>
            <a href="#" class="hover:text-white transition-colors duration-300">YouTube</a>
            <a href="#" class="hover:text-white transition-colors duration-300">Contact</a>
        </div>
    </div>
</div>
