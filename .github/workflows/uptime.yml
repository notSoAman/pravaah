name: Render Keep Awake

on:
  schedule:
    # Ping before Render's 15-minute idle shutdown window.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://pravaah.onrender.com"
          fi
          echo "Pinging ${SITE_URL}/health/..."
          curl --fail --show-error --silent --max-time 30 \
            --write-out "\nHTTP Status: %{http_code}\nTime: %{time_total}s\n" \
            "${SITE_URL%/}/health/"
