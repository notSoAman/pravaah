[providers]
providers = ["python", "node"]

[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.build]
cmds = [
  "pip install -r requirements.txt",
  "npm install",
  "npm run build",
  "python manage.py collectstatic --noinput"
]

[start]
cmd = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
